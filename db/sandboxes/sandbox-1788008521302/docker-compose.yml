version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: db-sandbox-1788008521302
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    build: .
    container_name: service-sandbox-1788008521302
    ports:
      - "3691:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db-sandbox-1788008521302:5432/postgres
      - PORT=3000
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
